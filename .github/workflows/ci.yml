name: ci

on:
  push:
  pull_request:

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required specs
        run: |
          test -f README.md
          test -f docs/procurement/REQUIREMENTS-MATRIX.md
          test -f docs/specs/SPEC-0000-PRODUCT.md
          test -f docs/specs/SPEC-0010-LGPD-SECURITY.md
          test -f docs/specs/SPEC-0014-TEST-ACCEPTANCE.md
          grep -R "CRQ-V-IA" README.md docs/specs >/dev/null

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv pip install --system -r apps/api/requirements.txt
      - name: Run Database Seeds
        run: |
          python services/ingest/run_seed.py
      - name: Run Automated Test Suite
        run: |
          pytest apps/api/tests/test_api.py -v
