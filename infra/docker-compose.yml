services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: crqvia
      POSTGRES_USER: crqvia
      POSTGRES_PASSWORD: crqvia_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crqvia -d crqvia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
